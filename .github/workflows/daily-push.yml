name: Daily push

# Sends every subscriber their daily thought. Subscriptions (with hour, time
# zone, themes, language) are saved by the app itself in Supabase; each one is
# sent on the first run at or after its hour, once per local day. GitHub's
# hourly schedule is best-effort, hence two slots per hour.

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send to every subscriber now, even if already sent today'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-push
        run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7

      - name: Send due reminders
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: node scripts/push.mjs

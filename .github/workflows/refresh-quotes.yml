name: Refresh quotes

# Re-fetches every source from Wikiquote and commits the snapshot under
# data/. The app uses this as an offline / rate-limit fallback; the live
# fetch in the browser is still the primary path.

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch quotes
        run: node scripts/fetch.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh quote snapshot ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
